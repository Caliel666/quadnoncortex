name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  JUCE_REF: master

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: ${{ env.JUCE_REF }}
          path: JUCE

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DJUCE_PATH="${{ github.workspace }}/JUCE" `
            -DQUADNONCORTEX_FETCH_NAM=ON

      - name: Build Release
        run: cmake --build build --parallel

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $src = Get-ChildItem -Recurse -Filter quadnoncortex.exe |
            Where-Object { $_.FullName -match 'build' } |
            Select-Object -First 1
          if (-not $src) { throw "quadnoncortex.exe not found" }
          Copy-Item $src.FullName dist/
          if (Test-Path README.md) { Copy-Item README.md dist/ }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quadnoncortex-windows-x64
          path: dist/
          if-no-files-found: error

  linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config git ninja-build \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxi-dev \
            libgl1-mesa-dev \
            libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: ${{ env.JUCE_REF }}
          path: JUCE

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DJUCE_PATH="${{ github.workspace }}/JUCE" \
            -DQUADNONCORTEX_FETCH_NAM=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Stage artifact
        run: |
          mkdir -p dist
          BIN=$(find build -type f -name quadnoncortex -executable | head -1)
          test -n "$BIN" || { echo "binary not found"; find build -name 'quadnoncortex*' ; exit 1; }
          cp "$BIN" dist/
          cp README.md dist/ || true
          chmod +x dist/quadnoncortex

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quadnoncortex-linux-x64
          path: dist/
          if-no-files-found: error

  # Native ARM runners (no QEMU) — available for public repos
  linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config git ninja-build \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxi-dev \
            libgl1-mesa-dev \
            libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: ${{ env.JUCE_REF }}
          path: JUCE

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DJUCE_PATH="${{ github.workspace }}/JUCE" \
            -DQUADNONCORTEX_FETCH_NAM=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Stage artifact
        run: |
          mkdir -p dist
          BIN=$(find build -type f -name quadnoncortex -executable | head -1)
          test -n "$BIN" || { echo "binary not found"; find build -name 'quadnoncortex*' ; exit 1; }
          cp "$BIN" dist/
          cp README.md dist/ || true
          chmod +x dist/quadnoncortex

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quadnoncortex-linux-arm64
          path: dist/
          if-no-files-found: error
